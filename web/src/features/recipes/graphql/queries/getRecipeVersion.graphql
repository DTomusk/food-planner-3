query GetRecipeVersion($id: ID!, $version: Int!) {
    recipe(id: $id) {
        id
        author {
            id
            username
        }
        version(version: $version) {
            name
            ingredientUsages {
                quantity
                unit {
                    val
                    symbol
                }
                ingredient {
                    id
                    name
                    counter
                    plural
                    counterPlural
                }
            }
            prepMins
            cookMins
            portions
            version
            source {
                type
                url
                bookTitle
                bookPage
                instructions
            }
            imgSrc
        }
    }
}