query GetRecipe($id: ID!) {
    recipe(id: $id) {
        id
        author {
            id
            username
        }
        currentVersion {
            name
            ingredientUsages {
                quantity
                unit {
                    symbol
                }
                ingredient {
                    name
                    counter
                    plural
                    counterPlural
                }
            }
            prepMins
            cookMins
            portions
            source {
                type
                url
                bookTitle
                bookPage
                instructions
            }
        }
    }
}