query GetRecipe($id: ID!) {
    recipe(id: $id) {
        name
        id
        user {
            id
            username
        }
        ingredientUsages {
            quantity
            unit {
                symbol
            }
            ingredient {
                name
                counter
                plural
                counterPlural
            }
        }
        prepMins
        cookMins
        portions
        source {
            type
            url
            bookTitle
            bookPage
            instructions
        }
    }
}