name: Deploy to fly.io

on:
    push:
        branches:
          - 'main'
    pull_request:
        branches:
          - 'main'

jobs:
    migrate:
        name: Run DB migrations
        runs-on: ubuntu-latest

        concurrency:
            group: 'deploy-api'
            cancel-in-progress: true

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install migrate CLI
              run: |
                curl -L https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz -o migrate.tar.gz
                tar -xzf migrate.tar.gz
                sudo mv migrate /usr/local/bin/migrate

            - name: Run migrations
              env:
                SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
              run: |
                if [ -z "$SUPABASE_DATABASE_URL" ]; then
                  echo "SUPABASE_DATABASE_URL secret is not set"
                  exit 1
                fi

                migrate -path api/migrations -database "$SUPABASE_DATABASE_URL" up

    deploy:
        name: Deploy API
        runs-on: ubuntu-latest
        needs: migrate

        concurrency:
            group: 'deploy-api'
            cancel-in-progress: true

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Fly.io CLI
              uses: superfly/flyctl-actions/setup-flyctl@v1

            - name: Deploy to Fly.io
              env:
                FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
              run: |
                cd api
                flyctl deploy --remote-only
