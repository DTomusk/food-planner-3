services:
  db: 
    image: postgres:18.1
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_planner
    ports:
      - "5432:5432"
    volumes:
      - food_planner_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d food_planner"]
      interval: 10s
      retries: 5

  pgAdmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

  migrate:
    image: migrate/migrate:v4.19.1
    depends_on:
      db:
        condition: service_healthy
    command: [
      "-path", "/migrations",
      "-database", "postgres://user:password@db:5432/food_planner?sslmode=disable",
      "up"
    ]
    volumes:
      - ./migrations:/migrations

  ingredient-sync:
    build:
      context: .
      dockerfile: ./cmd/ingredient-sync/Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: ./cmd/server/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  redis: 
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        retries: 5

  delete-recipes:
    build:
      context: .
      dockerfile: ./cmd/delete-recipes/Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  delete-uploads:
    build:
      context: .
      dockerfile: ./cmd/delete-uploads/Dockerfile
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  food_planner_db_data: