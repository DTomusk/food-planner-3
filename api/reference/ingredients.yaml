# Unit reference (consider replacing ints with string keys)
#   0 = UnitUnknown (used for ingredients that cannot be added to recipes because they are categories )
# 	1 = Quantum (pieces, cloves, but also unitless like 5 eggs, the presence of counters differentiates between the two cases)
# 	2 = Gram
# 	3 = Milliliter
# 	4 = Tablespoon
# 	5 = Teaspoon
# 	6 = Centimeter

# Animal product level reference
# 0 = Not an animal product (vegan)
# 1 = Animal product but not from muscle meat (e.g. milk, egg, cheese) vegetarian
# 2 = Muscle meat (e.g. beef, chicken, pork, fish) not vegetarian

# Is searchable should be true for ingredients that can be added to recipes
# Not searchable ingredients are used for categorization and don't have sufficient meaning in the context of a recipe (e.g. allium, origin_animal)

# Processed level defaults to 0 (raw ingrediets)
# 1 are derived ingredients (e.g. flour, cheese, bacon rasher) that primarily come from one raw ingredient
# 2 are composites that are made up of multiple raw or derived ingredients (e.g. pasta, bread, sauces)

# Counters are for unit 1 ingredients that are typically counted in specific units (e.g. slices of bread, rasher of bacon, clove of garlic). The counter field specifies the singular form of the unit, and counter_plural specifies the plural form

